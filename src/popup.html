<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quick Apply</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        width: 280px;
        margin: 0;
        padding: 14px;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      h1 { font-size: 14px; margin: 0 0 10px; }
      button {
        width: 100%;
        padding: 9px 12px;
        font-size: 13px;
        font-weight: 600;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
      }
      button:hover { background: #1d4ed8; }
      button:disabled { opacity: 0.5; cursor: default; }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 12px 0;
      }
      label.toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; }
      .muted { color: #6b7280; font-size: 12px; }
      #status { margin-top: 10px; min-height: 16px; }
      a { color: #2563eb; cursor: pointer; text-decoration: none; }
      a:hover { text-decoration: underline; }
      hr { border: 0; border-top: 1px solid #e5e7eb; margin: 12px 0; }
    </style>
  </head>
  <body>
    <h1>Quick Apply</h1>
    <button id="fill">Fill this application</button>
    <div id="status" class="muted"></div>

    <hr />

    <div class="row">
      <label class="toggle"><input type="checkbox" id="autofill" /> Auto-fill on page load</label>
    </div>
    <div class="row">
      <label class="toggle"><input type="checkbox" id="learn" /> Learn new fields</label>
    </div>

    <hr />
    <div class="row">
      <a id="options">Edit profile &amp; learned fields →</a>
    </div>
    <p class="muted">Fill-only. Always review and submit yourself.</p>

    <script src="common.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
